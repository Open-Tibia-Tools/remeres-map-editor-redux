name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # 1. Non-draft same-repo pull_request events
    # 2. Non-draft fork pull_request_target events (runs with base repo secrets)
    # 3. PR comments containing "/opencode review" or "/opencode"
    # 4. Manual workflow_dispatch
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Acknowledge comment trigger
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes' || true

      - name: Resolve PR Head SHA
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr_info.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Configure OpenCode small model
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/opencode"
          cat << 'EOF' > "${HOME}/.config/opencode/opencode.jsonc"
          {
            "$schema": "https://opencode.ai/config.json",
            "small_model": "opencode/glm-5.3-flash-free",
            "permission": {
              "external_directory": {
                "*": "deny"
              },
              "bash": "deny",
              "edit": "deny"
            }
          }
          EOF

      - name: Run OpenCode PR Review
        uses: dceoy/opencode-action@163f9a9cd3d3f497e2847635585419f951371d2f # v0.8.1
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          use-github-token: true
          mentions: '/opencode review,/opencode,/oc'
          prompt: |
            Review pull request #${{ steps.pr_info.outputs.pr_number }} in Remere's Map Editor Redux (C++20/23, wxWidgets, OpenGL/NanoVG) and post ONE review comment formatted like a CodeRabbit review.

            Repository: ${{ github.repository }}
            Reviewed commit (full SHA): ${{ steps.pr_info.outputs.head_sha }}

            HOW TO REVIEW

            Read AGENTS.md first; its rules are part of the review criteria. Then read the diff (`gh pr diff ${{ steps.pr_info.outputs.pr_number }}`) and open surrounding code wherever you need context to judge a change.

            Look for, in priority order:
            1. Bugs: logic errors, undefined behavior, lifetime/ownership mistakes, leaks, broken OTBM compatibility, map changes that bypass undo, unchecked sizes when parsing files.
            2. Violations of AGENTS.md rules.
            3. Modern C++ / clean-code issues that meaningfully hurt correctness, readability or performance (e.g. per-frame or per-tile allocations in render paths, raw owning pointers).

            Only comment on lines this PR adds or changes. Leave existing code alone unless the PR makes it worse.

            Precision matters more than coverage. Report a finding only if you can name the exact lines and explain concretely what goes wrong. If unsure, leave it out. Zero findings is a normal, good result; never pad. Pure taste goes in Nitpick comments, or nowhere.

            Line numbers always refer to the file as it is at the reviewed commit (the new side of the diff), never to diff hunk positions. Check every line range against the actual file before writing it.

            Out of scope: CI workflow config (permissions, action pinning).

            LABELS

            Every finding gets one type and one severity, written in italics separated by a pipe: `_<Type>_ | _<Severity>_`
            - Type: Potential issue (a bug or rule violation) | Refactor suggestion (works, but should be restructured) | Nitpick (minor, optional)
            - Severity: Critical (crash, data loss, corrupted saved maps) | Major (incorrect behavior or an AGENTS.md violation) | Minor (worth fixing, low impact) | Trivial (nitpicks only)
            Potential issue and Refactor suggestion findings go under "Actionable comments". Nitpick findings go under "Nitpick comments".

            GITHUB MARKDOWN RULES (the comment must render correctly on GitHub)

            General:
            - No emojis and no emoji codes (`:name:`). No em dashes or en dashes; use hyphens, colons or parentheses.
            - Leave a blank line before and after every heading, paragraph, table, list, code block and <details> block.
            - Wrap file paths, symbols, and anything containing `<`, `>`, `*`, `_` or `|` in backticks so GitHub does not treat it as HTML or formatting.
            - Tables need a header row and an alignment row (`| :--- | :--- |`). Escape a literal pipe inside a table cell as `\|`.

            Collapsed sections:
            - Every <details> block must have a <summary> line, then a blank line, then the content, then a blank line, then the closing tag. Without the blank lines the Markdown inside will not render.
            - Nested file groups use `<summary>...</summary><blockquote>` and close with `</blockquote></details>`, exactly as in the template.
            - Do not use the `open` attribute; every section starts collapsed.

            Code blocks:
            - Every fenced code block has a language identifier: `diff` for fixes, `text` for AI prompts, `cpp` for C++ snippets.
            - If the content of a code block itself contains triple backticks, fence that block with four backticks (````) instead of three.
            - In `diff` blocks every line starts with `-`, `+` or a space. Show only the lines that change plus at most 2 lines of context.

            Autolinks and mentions:
            - `#<number>` and `GH-<number>` turn into links to issues or pull requests. Only write them to reference a real issue or PR. Never number findings as `#1`, `#2`; use plain `1.` numbering or none.
            - A bare 7-40 character hex string turns into a commit link. Write commit SHAs bare (not in backticks) so they link; never write other hex values bare.
            - `@name` outside code turns into a mention and notifies that user. Never mention anyone. Always write the `@<path>` file references inside backticks or a code block.

            Code permalinks:
            - Under each finding, put a permalink to the exact lines on its own line, with nothing else on that line. GitHub renders it as a code snippet showing those lines. Format (full SHA, no backticks, no link text):
              https://github.com/${{ github.repository }}/blob/${{ steps.pr_info.outputs.head_sha }}/<path>#L<start>-L<end>
              For a single line use `#L<line>` with no range.
            - Never shorten the SHA in a permalink and never point a permalink at a branch name.

            Task lists:
            - Use plain Markdown task list items (`- [ ] text`) only where the template shows them. Do not use ```[tasklist] blocks; GitHub retired them.
            - If a task item's text starts with a parenthesis, escape it: `- [ ] \(text)`.

            OUTPUT

            Output only the review comment, following this template exactly. Replace every <placeholder>. Drop any section whose count is 0, except the "Actionable comments posted" line.

            ## Walkthrough

            <One paragraph: what the PR changes and why, in plain terms.>

            ## Changes

            | Cohort / File(s) | Summary |
            | :--- | :--- |
            | **<Cohort name>** <br> `<path/one.cpp>`, `<path/one.h>` | <What changed in this group of files.> |

            ## Estimated code review effort

            **<1-5> (<Trivial | Simple | Moderate | Complex | Very complex>)** | ~<minutes> minutes

            ---

            **Actionable comments posted: <N>**

            - [ ] `<path>` lines <start>-<end>: <Short imperative title.>
            - [ ] `<path>` line <line>: <Short imperative title.>

            <details>
            <summary>Prompt for all review comments with AI agents</summary>

            ```text
            Verify each finding against the current code and only fix it if needed.

            Inline comments:
            In `@<path>`:
            - Around line <start>-<end>: <Self-contained instruction: name the function or symbol, say what is wrong, say exactly what to change.>

            Nitpick comments:
            In `@<path>`:
            - Around line <start>-<end>: <Self-contained instruction.>
            ```

            </details>

            <details>
            <summary>Actionable comments (<N>)</summary><blockquote>

            <details>
            <summary><path> (<count in this file>)</summary><blockquote>

            `<start>-<end>`: **<Short imperative title.>**

            _<Type>_ | _<Severity>_

            https://github.com/${{ github.repository }}/blob/${{ steps.pr_info.outputs.head_sha }}/<path>#L<start>-L<end>

            <What is wrong, why it matters, and which AGENTS.md rule or C++ idiom applies. 1-4 sentences.>

            <details>
            <summary>Proposed fix</summary>

            ```diff
            - <old line>
            + <new line>
            ```

            </details>

            <details>
            <summary>Prompt for AI Agents</summary>

            ```text
            In `@<path>` around lines <start> - <end>, <self-contained instruction: name the function or symbol, describe the problem, describe the exact change, and anything that must stay unchanged>.
            ```

            </details>

            </blockquote></details>

            </blockquote></details>

            <details>
            <summary>Nitpick comments (<M>)</summary><blockquote>

            <details>
            <summary><path> (<count in this file>)</summary><blockquote>

            `<start>-<end>`: **<Short imperative title.>**

            _Nitpick_ | _Trivial_

            https://github.com/${{ github.repository }}/blob/${{ steps.pr_info.outputs.head_sha }}/<path>#L<start>-L<end>

            <1-2 sentences.>

            <details>
            <summary>Prompt for AI Agents</summary>

            ```text
            In `@<path>` around lines <start> - <end>, <self-contained instruction>.
            ```

            </details>

            </blockquote></details>

            </blockquote></details>

            <details>
            <summary>Review details</summary>

            **Configuration used**: `AGENTS.md`

            **Model**: `opencode/glm-5.3-flash-free`

            **Commits**: Reviewing files that changed from the base of the PR and up to ${{ steps.pr_info.outputs.head_sha }}.

            <details>
            <summary>Files selected for processing (<K>)</summary>

            * `<path>`

            </details>

            </details>

            Template notes:
            - The task list under "Actionable comments posted" has one item per actionable finding (not nitpicks), in the same order as the findings below it.
            - Repeat the per-file <details> block for each file with findings, and repeat the finding block inside it for each finding in that file.
            - Leave out the "Proposed fix" block when the fix is not small and local; describe the fix in the explanation instead. Never invent code you have not checked against the file.
            - The "Prompt for all review comments" block must list every finding from both sections, and each line must make sense without reading the rest of the review.
            - If there are no findings at all, output the Walkthrough, Changes, Estimated code review effort, `**Actionable comments posted: 0**`, and Review details. Nothing else.
