name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  review:
    # 1. Non-draft same-repo pull_request events
    # 2. Non-draft fork pull_request_target events (review-only via API; no PR head checkout)
    # 3. Manual workflow_dispatch
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'workflow_dispatch')
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Resolve PR metadata for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pr_number '${PR_NUMBER}'; expected a positive integer."
            exit 1
          fi
          pr_json="$(gh pr view "${PR_NUMBER}" --repo "${GH_REPO}" --json url,headRefOid)"
          pr_url="$(jq -r '.url' <<< "${pr_json}")"
          head_sha="$(jq -r '.headRefOid' <<< "${pr_json}")"
          if [ -z "${pr_url}" ] || ! [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Failed to resolve PR URL or 40-char head SHA for PR #${PR_NUMBER}."
            exit 1
          fi
          {
            echo "PR_REVIEW_URL=${pr_url}"
            echo "PR_REVIEW_HEAD_SHA=${head_sha}"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode PR Review
        uses: dceoy/opencode-action@cda16d479232f0998a3046425dc43747f1c4c66e # v1.1.0
        env:
          # Free opencode/*-free models use public access when OPENCODE_API_KEY is unset;
          # passing an expired Console key triggers "Reconnect OpenCode Console to continue."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          runtime: v2
          review-only: true
          use-bundled-toolkit: true
          use-github-token: true
          prompt: ''
