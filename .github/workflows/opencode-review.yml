name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip fork PRs because GitHub withholds repository secrets (OPENCODE_API_KEY) from forks
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR Head SHA
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure OpenCode small model
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/opencode"
          cat << 'EOF' > "${HOME}/.config/opencode/opencode.jsonc"
          {
            "$schema": "https://opencode.ai/config.json",
            "small_model": "opencode/glm-5.3-flash-free",
            "permission": {
              "external_directory": {
                "*": "deny"
              }
            }
          }
          EOF

      - name: Run OpenCode PR Review
        uses: dceoy/opencode-action@163f9a9cd3d3f497e2847635585419f951371d2f # v0.8.1
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEW_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}
          PR_REVIEW_HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        with:
          model: opencode/glm-5.3-flash-free
          use-github-token: true
          review-only: true
          prompt: |
            Focus on security, functional defects, and regression risks.

            FORMATTING CONSTRAINTS:
            - DO NOT USE EMOJIS anywhere in the review.
            - DO NOT USE EM DASHES ("—" or "–"). Use standard hyphens ("-"), colons (":"), or parentheses.
            - Follow GitHub Markdown syntax: markdown tables, bullet lists, and suggestion diff blocks.
            - When defects map to specific changed lines, publish them as inline comments via the reviews API comments payload.
