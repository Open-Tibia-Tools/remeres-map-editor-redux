name: AI Issue & PR Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or PR number to triage'
        required: true
        default: '1034'
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: triage-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  triage:
    name: AI Triage (EmbeddingGemma-2)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Cache Gemma Model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: model-cache
        with:
          path: ~/.cache/huggingface
          key: embeddinggemma-2-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/scripts/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run AI Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONTEXT: ${{ toJson(github.event) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/triage.py
