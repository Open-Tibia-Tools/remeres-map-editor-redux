---
name: Check code style
on:
  pull_request:
    paths:
      - "source/**"
      - ".clang-format"
      - ".github/workflows/clang-format.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "source/**"
      - ".clang-format"
      - ".github/workflows/clang-format.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: Run clang-format (diff)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check modified C++ lines with git-clang-format
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${BASE_REF}"
            base_sha="$(git merge-base "origin/${BASE_REF}" HEAD)"
          else
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base_sha="${BEFORE_SHA}"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              echo "Initial commit detected; skipping diff-only clang-format check."
              exit 0
            fi
          fi

          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "${base_sha}" HEAD -- ':(glob)source/**/*.cpp' ':(glob)source/**/*.h' ':(glob)source/**/*.hpp')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No modified C++ files under source/."
            exit 0
          fi

          set +e
          diff_output="$(git clang-format --diff "${base_sha}" -- "${changed_files[@]}" 2>&1)"
          rc=$?
          set -e

          if grep -qE '^diff --git ' <<< "${diff_output}"; then
            printf '%s\n' "${diff_output}"
            echo "::error::Formatting mismatch on modified lines. Run 'git clang-format ${base_sha} -- source/' to fix."
            exit 1
          fi

          if [ "${rc}" -ne 0 ]; then
            printf '%s\n' "${diff_output}"
            exit "${rc}"
          fi

          echo "All modified C++ lines match .clang-format."
