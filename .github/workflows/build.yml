name: Build RME

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'alpha*'
  pull_request:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Existing Build RME run ID to publish without rebuilding (leave empty for a full build)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux
    if: github.event_name != 'workflow_dispatch' || inputs.run_id == ''
    runs-on: ubuntu-26.04

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            libglu1-mesa-dev \
            freeglut3-dev \
            libxmu-dev \
            libxi-dev \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libsecret-1-dev \
            libgcrypt20-dev \
            libsystemd-dev \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            libltdl-dev \
            nasm \
            curl \
            zip \
            unzip \
            tar

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: '9a5dfef5d1a0438a7d24856a85bd60f309d355e9'

      - name: Cache vcpkg installed packages and binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/vcpkg_installed
            .vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
            vcpkg-installed-${{ runner.os }}-

      - name: Setup ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ~/.ccache
          ccache --max-size=500M
          ccache --set-config=compression=true

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-rme-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-rme-${{ runner.os }}-

      - name: Build RME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN:\$ORIGIN/lib" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify Linux binary dependencies
        run: |
          set -euo pipefail
          ldd_output="$(LD_LIBRARY_PATH="build/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}" ldd build/rme)"
          printf '%s\n' "${ldd_output}"
          if grep -q 'not found' <<< "${ldd_output}"; then
            echo "::error::Missing shared library dependency detected in build/rme"
            exit 1
          fi

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Package Linux distribution
        run: |
          mkdir -p dist/rme-linux
          cp build/rme dist/rme-linux/
          chmod +x dist/rme-linux/rme
          if [ -d build/data ]; then
            cp -r build/data dist/rme-linux/data
          elif [ -d data ]; then
            cp -r data dist/rme-linux/data
          fi
          if [ -d build/assets ]; then
            cp -r build/assets dist/rme-linux/assets
          elif [ -d source/assets ]; then
            cp -r source/assets dist/rme-linux/assets
          fi
          if [ -d brushes ]; then
            cp -r brushes dist/rme-linux/brushes
          fi
          if [ -d ext/nanovg ]; then
            mkdir -p dist/rme-linux/ext
            cp -r ext/nanovg dist/rme-linux/ext/nanovg
          fi
          if [ -d extensions ]; then
            cp -r extensions dist/rme-linux/extensions
          fi
          if [ -d icons ]; then
            cp -r icons dist/rme-linux/icons
          fi
          if [ -d lua_tests ]; then
            cp -r lua_tests dist/rme-linux/lua_tests
          fi
          if [ -d scripts ]; then
            cp -r scripts dist/rme-linux/scripts
          fi
          if [ -d tools ]; then
            cp -r tools dist/rme-linux/tools
          fi
          if [ -f README.md ]; then
            cp README.md dist/rme-linux/
          fi
          if [ -f LICENSE ]; then
            cp LICENSE dist/rme-linux/
          fi
          if [ -f LICENSE.rtf ]; then
            cp LICENSE.rtf dist/rme-linux/
          fi
          if [ -d build/vcpkg_installed/x64-linux/lib ]; then
            mkdir -p dist/rme-linux/lib
            cp -P build/vcpkg_installed/x64-linux/lib/*.so* dist/rme-linux/lib/ 2>/dev/null || true
          fi
          cat << 'EOF' > dist/rme-linux/run.sh
          #!/bin/sh
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR:$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/rme" "$@"
          EOF
          chmod +x dist/rme-linux/run.sh
          tar -czvf rme-linux-x64-alpha.tar.gz -C dist/rme-linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rme-linux-alpha
          path: rme-linux-x64-alpha.tar.gz
          retention-days: 30

  build-windows:
    name: Build Windows
    if: github.event_name != 'workflow_dispatch' || inputs.run_id == ''
    runs-on: windows-2025

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio installation with C++ x64 tools not found."
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          $beforePath = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]($env:PATH -split ';'),
            [System.StringComparer]::OrdinalIgnoreCase
          )
          cmd /c "call `"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -ieq 'PATH') {
                $addedPaths = @($value -split ';' | Where-Object { $_ -and -not $beforePath.Contains($_) })
                [array]::Reverse($addedPaths)
                foreach ($entry in $addedPaths) {
                  Add-Content -Path $env:GITHUB_PATH -Value $entry
                }
              } elseif ($name -inotmatch '^(PROMPT|__VSCMD_PREINIT_PATH)$' -and $value -notmatch '[\r\n]') {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: '9a5dfef5d1a0438a7d24856a85bd60f309d355e9'

      - name: Cache vcpkg installed packages and binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/vcpkg_installed
            .vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
            vcpkg-installed-${{ runner.os }}-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ccache-${{ runner.os }}
          max-size: 500M

      - name: Configure CMake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build RME
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Windows distribution
        run: |
          New-Item -ItemType Directory -Force -Path dist/rme-windows | Out-Null
          if (Test-Path build/rme.exe) {
            Copy-Item build/rme.exe dist/rme-windows/
          } elseif (Test-Path build/Release/rme.exe) {
            Copy-Item build/Release/rme.exe dist/rme-windows/
          }
          Get-ChildItem -Path build -Filter "*.dll" | Copy-Item -Destination dist/rme-windows/ -Force
          if (Test-Path build/vcpkg_installed/x64-windows/bin) {
            Get-ChildItem -Path build/vcpkg_installed/x64-windows/bin -Filter "*.dll" | Copy-Item -Destination dist/rme-windows/ -Force
          }
          if (Test-Path build/data) {
            Copy-Item -Recurse build/data dist/rme-windows/data
          } elseif (Test-Path data) {
            Copy-Item -Recurse data dist/rme-windows/data
          }
          if (Test-Path build/assets) {
            Copy-Item -Recurse build/assets dist/rme-windows/assets
          } elseif (Test-Path source/assets) {
            Copy-Item -Recurse source/assets dist/rme-windows/assets
          }
          if (Test-Path brushes) {
            Copy-Item -Recurse brushes dist/rme-windows/brushes
          }
          if (Test-Path ext/nanovg) {
            New-Item -ItemType Directory -Force -Path dist/rme-windows/ext | Out-Null
            Copy-Item -Recurse ext/nanovg dist/rme-windows/ext/nanovg
          }
          if (Test-Path extensions) {
            Copy-Item -Recurse extensions dist/rme-windows/extensions
          }
          if (Test-Path icons) {
            Copy-Item -Recurse icons dist/rme-windows/icons
          }
          if (Test-Path lua_tests) {
            Copy-Item -Recurse lua_tests dist/rme-windows/lua_tests
          }
          if (Test-Path scripts) {
            Copy-Item -Recurse scripts dist/rme-windows/scripts
          }
          if (Test-Path tools) {
            Copy-Item -Recurse tools dist/rme-windows/tools
          }
          if (Test-Path README.md) {
            Copy-Item README.md dist/rme-windows/
          }
          if (Test-Path LICENSE) {
            Copy-Item LICENSE dist/rme-windows/
          }
          if (Test-Path LICENSE.rtf) {
            Copy-Item LICENSE.rtf dist/rme-windows/
          }
          Compress-Archive -Path dist/rme-windows/* -DestinationPath rme-windows-x64-alpha.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rme-windows-alpha
          path: rme-windows-x64-alpha.zip
          retention-days: 30

  release:
    name: Publish Alpha Release
    needs: [build-linux, build-windows]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.run_id != '') ||
        (github.event_name != 'pull_request' &&
         (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
         needs.build-linux.result == 'success' &&
         needs.build-windows.result == 'success')
      )
    runs-on: ubuntu-26.04
    concurrency:
      group: release-${{ inputs.run_id || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_RUN_ID}" ]; then
            if ! [[ "${DISPATCH_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid run_id '${DISPATCH_RUN_ID}'; expected numeric workflow run ID."
              exit 1
            fi
            run_json="$(gh run view "${DISPATCH_RUN_ID}" --repo "${GH_REPO}" --json headSha,number,conclusion,event,headBranch,workflowName)"
            workflow_name="$(jq -r '.workflowName' <<< "${run_json}")"
            event_name="$(jq -r '.event' <<< "${run_json}")"
            head_branch="$(jq -r '.headBranch' <<< "${run_json}")"
            conclusion="$(jq -r '.conclusion' <<< "${run_json}")"
            if [ "${workflow_name}" != "Build RME" ]; then
              echo "::error::Target run ${DISPATCH_RUN_ID} belongs to '${workflow_name}', expected 'Build RME'."
              exit 1
            fi
            if [ "${event_name}" = "pull_request" ] || [ "${event_name}" = "pull_request_target" ]; then
              echo "::error::Refusing to publish artifacts from pull-request run ${DISPATCH_RUN_ID} (event '${event_name}')."
              exit 1
            fi
            if [[ "${head_branch}" != "master" && "${head_branch}" != "main" && ! "${head_branch}" =~ ^(v|alpha) ]]; then
              echo "::error::Target run ${DISPATCH_RUN_ID} branch/tag '${head_branch}' is not eligible for release."
              exit 1
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::Target run ${DISPATCH_RUN_ID} has conclusion '${conclusion}', expected 'success'."
              exit 1
            fi
            target_sha="$(jq -r '.headSha' <<< "${run_json}")"
            target_run_number="$(jq -r '.number' <<< "${run_json}")"
            if [[ "${head_branch}" =~ ^(v|alpha) ]] && [ "${event_name}" = "push" ]; then
              tag_name="${head_branch}"
              release_name="RME ${head_branch}"
            else
              tag_name="alpha-${target_run_number}"
              release_name="RME Alpha #${target_run_number}"
            fi
          else
            target_sha="${CURRENT_SHA}"
            if [[ "${CURRENT_REF}" == refs/tags/* ]]; then
              tag_name="${CURRENT_REF_NAME}"
              release_name="RME ${CURRENT_REF_NAME}"
            else
              tag_name="alpha-${CURRENT_RUN_NUMBER}"
              release_name="RME Alpha #${CURRENT_RUN_NUMBER}"
            fi
          fi
          {
            echo "target_sha=${target_sha}"
            echo "tag_name=${tag_name}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rme-linux-alpha
          path: artifacts/linux
          github-token: ${{ inputs.run_id != '' && secrets.GITHUB_TOKEN || '' }}
          run-id: ${{ inputs.run_id != '' && inputs.run_id || github.run_id }}

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rme-windows-alpha
          path: artifacts/windows
          github-token: ${{ inputs.run_id != '' && secrets.GITHUB_TOKEN || '' }}
          run-id: ${{ inputs.run_id != '' && inputs.run_id || github.run_id }}

      - name: Prepare Release Files and Checksums
        run: |
          mkdir -p release-files
          cp artifacts/windows/rme-windows-x64-alpha.zip release-files/
          cp artifacts/linux/rme-linux-x64-alpha.tar.gz release-files/
          cd release-files
          sha256sum rme-windows-x64-alpha.zip rme-linux-x64-alpha.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ steps.meta.outputs.target_sha }}
          files: |
            release-files/rme-windows-x64-alpha.zip
            release-files/rme-linux-x64-alpha.tar.gz
            release-files/SHA256SUMS.txt
          body: |
            ### Automated Alpha Build
            This is an automated alpha pre-release built from commit `${{ steps.meta.outputs.target_sha }}`.

            #### Included Packages:
            - **Windows (x64)**: `rme-windows-x64-alpha.zip` (includes `rme.exe`, required DLLs, assets, brushes, data, ext/nanovg, extensions, icons, lua_tests, scripts, tools, README, and licenses)
            - **Linux (x64)**: `rme-linux-x64-alpha.tar.gz` (includes `rme` binary, required libraries, assets, brushes, data, ext/nanovg, extensions, icons, lua_tests, scripts, tools, README, and licenses)
            - **Checksums**: `SHA256SUMS.txt`
